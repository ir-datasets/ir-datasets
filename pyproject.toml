[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ir_datasets"
description = "provides a common interface to many IR ad-hoc ranking benchmarks, training datasets, etc."
readme = "README.md"
authors = [
    {name = "Sean MacAvaney", email = "sean.macavaney@glasgow.ac.uk"},
]
maintainers = [
  {name = "Sean MacAvaney", email = "sean.macavaney@glasgow.ac.uk"},
]
requires-python = ">=3.8"
classifiers = [
  "Programming Language :: Python",
  "Operating System :: OS Independent",
  "Topic :: Text Processing",
  "Topic :: Text Processing :: Indexing",
  "License :: OSI Approved :: MIT License",
]
dynamic = ["version", "dependencies"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
exclude = ["test"]

[tool.setuptools.dynamic]
version = {attr = "ir_datasets.__version__"}
dependencies = {file = ["requirements.txt"]}

# Providers ir_datasets.v2 discovers in installed packages. The entry-point
# *name* is the prefix the provider claims; a mismatch is refused.
[project.entry-points."ir_datasets.providers"]
irds = "ir_datasets.v2.provider:irds"
hf = "ir_datasets.v2.hf_provider:hf"
clirmatrix = "ir_datasets.v2.clirmatrix_provider:clirmatrix"
legacy = "ir_datasets.v2.legacy_provider:legacy"

[project.optional-dependencies]
car = [
  "trec-car-tools>=2.5.4",
]
hf = [
  "huggingface_hub>=0.20.0",
  "datasets>=2.14.0",
  "pyarrow>=16.1.0",
]
warc = [
  "warc3-wet>=0.2.3",
  "warc3-wet-clueweb09>=0.2.5"
]
pyautocorpus = [
  "pyautocorpus>=0.1.12"
]
pyarrow = [
  "pyarrow>=16.1.0"
]
unlzw3 = [
  "unlzw3>=0.2.1"
]
beautifulsoup4 = [
  "beautifulsoup4>=4.4.1"
]
inscriptis = [
  "inscriptis>=2.2.0"
]
zlib-state = [
  "zlib-state>=0.1.3"
]
ijson = [
  "ijson>=3.1.3"
]
all = [
  "trec-car-tools>=2.5.4",
  "warc3-wet>=0.2.3",
  "warc3-wet-clueweb09>=0.2.5",
  "pyarrow>=16.1.0",
  "pyautocorpus>=0.1.12",
  "unlzw3>=0.2.1",
  "beautifulsoup4>=4.4.1",
  "inscriptis>=2.2.0",
  "zlib-state>=0.1.3",
  "ijson>=3.1.3",
  "huggingface_hub>=0.20.0",
]

[project.urls]
"Homepage" = "https://ir-datasets.com/"
"Documentation" = "https://project.readthedocs.io/"
"Source" = "https://github.com/ir-datasets/ir-datasets"
"Issues" = "https://github.com/ir-datasets/ir-datasets/issues"
"Bug Tracker" = "https://github.com/ir-datasets/ir-datasets/issues"

[project.scripts]
ir_datasets = "ir_datasets:main_cli"
