  - {fragment: qrel-case-case-train, type: irds:Qrels, config: qrel_case_case, split: train, citation: "dblp:journals/corr/abs-2608-03756"}
  - {fragment: qrel-case-case-dev, type: irds:Qrels, config: qrel_case_case, split: dev, citation: "dblp:journals/corr/abs-2608-03756"}
