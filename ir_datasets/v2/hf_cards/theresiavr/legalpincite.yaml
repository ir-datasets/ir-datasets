ir-datasets:
  # The dataset as a whole: hf:theresiavr/legalpincite
  - fragment: null
    type: irds:Overview
    parts: all
    prettyName: LegalPincite
    citation: "dblp:journals/corr/abs-2608-03756"
    description: A legal retrieval collection from Court of Justice of the European Union judgments, at case and paragraph level.
    summary: |
      LegalPincite is a legal information retrieval collection built from judgments of the
      Court of Justice of the European Union (CJEU), taken from EUR-Lex. Judges cite earlier
      judgments, and often a specific paragraph of them (a *pincite*). The collection turns
      those citations into retrieval tasks: given a citing case or paragraph, find what it
      cites.

      ## Tasks

      There are three levels, named query level, then document level:

      | Task | Query | Documents to rank |
      |---|---|---|
      | `case-case` | a whole citing case | cases |
      | `par-case` | a citing paragraph | cases |
      | `par-par` | a citing paragraph | paragraphs (the pincite) |

      Paragraph-to-paragraph is the finest and hardest: the system has to find the paragraph
      that supports the citing one, not just the right case.

      ## Splits

      Queries are split by year to avoid leaking the future into the past: train queries are
      from cases before 2018, dev from 2018 to 2021 and test from 2022 to 2025. For dev and test,
      the candidate documents and the cited ones all pre-date every query in that split. Only
      dev and test come with a candidate corpus (dev: 10,359 cases, 471,843 paragraphs; test:
      12,081 cases, 593,877 paragraphs). The corpus holds *all* paragraphs, cited or not, which is
      what makes it a realistic ranking problem. Train has queries and judgments but no corpus
      of its own, so the benchmarks here are dev and test.

      | Task | Split | Queries | Relevant pairs |
      |---|---|---:|---:|
      | `case-case` | train / dev / test | 6,738 / 1,263 / 1,639 | 43,977 / 7,799 / 10,376 |
      | `par-case` | train / dev / test | 43,847 / 9,706 / 14,504 | 68,394 / 12,850 / 17,659 |
      | `par-par` | train / dev / test | 43,847 / 9,706 / 14,504 | 85,768 / 16,244 / 23,415 |

      ## Judgments

      Most judgments are the citations the court actually made, read from EUR-Lex. The dev split
      also includes judgments from two law experts (from earlier work by Olsen and colleagues):
      a paragraph counts as relevant if both experts agreed that it contains the rule in the
      citing paragraph, verbatim or in a fuller form. Every judgment row is a relevant pair
      (the label is always 1), and a `source` column says whether it came from `eur_lex` or
      `human`; a pair with both has two rows.

      The judgments are not exhaustive. A paragraph that was not cited is not necessarily
      irrelevant, so recall is best read cautiously and early-precision measures suit the data.

      ## Using it

      - Use the masked `query` text, which is the table's `text`. Citation details (the cited
        case, its number, the parties, the paragraph number) have been removed so a system cannot
        simply look them up. The original text is kept in the `query_unmasked` column, for
        analysis only; do not rank with it.
      - Evaluate each task and split separately; the paper does not combine them. Tune on dev,
        then report on test. It reports hit rate and nDCG at 3, 5 and 10, and MAP and MRR at
        1000.
      - To save compute, the authors suggest evaluating on the smaller group of dev queries
        that have expert judgments as well as EUR-Lex ones.

      ## Names

      Tables are `<kind>-<level>-<split>`, for example [[query-par-test]] or [[qrel-par-par-dev]].
      Benchmarks are `<query level>-<document level>-<split>`, for example [[par-par-test]] (the
      headline task) or [[case-case-dev]].

      This is a research and benchmarking collection, not legal advice or a complete record of
      CJEU precedent.

