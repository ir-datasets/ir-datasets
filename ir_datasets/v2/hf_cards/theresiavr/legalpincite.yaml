# LegalPincite (Rampisela, Olsen, Colavizza): https://huggingface.co/datasets/theresiavr/legalpincite
# Written against the commit below; license and language are the Hub card's own.
commit: ebf0c37cca4c8b69291fb9eecc8ecb8784575637
license: cc-by-4.0
language: [en]

ir-datasets:
  # The dataset as a whole: hf:theresiavr/legalpincite
  - fragment: null
    type: irds:Overview
    parts: all
    citation: "dblp:journals/corr/abs-2608-03756"
  # A table's fragment is {config}-{split}; config and split say where it is read from.
  # (docno, qid, query and label are mapped to doc_id, query_id, text and relevance automatically.)
  # Docs
  - {fragment: doc-par-dev, type: irds:Docs, config: doc_par, split: dev, citation: "dblp:journals/corr/abs-2608-03756"}
  - {fragment: doc-par-test, type: irds:Docs, config: doc_par, split: test, citation: "dblp:journals/corr/abs-2608-03756"}
  - {fragment: doc-case-dev, type: irds:Docs, config: doc_case, split: dev, citation: "dblp:journals/corr/abs-2608-03756"}
  - {fragment: doc-case-test, type: irds:Docs, config: doc_case, split: test, citation: "dblp:journals/corr/abs-2608-03756"}
  # Queries (`query` is the masked text; `query_unmasked` stays as an extra column for ablations)
  - {fragment: query-par-train, type: irds:Queries, config: query_par, split: train, citation: "dblp:journals/corr/abs-2608-03756"}
  - {fragment: query-par-dev, type: irds:Queries, config: query_par, split: dev, citation: "dblp:journals/corr/abs-2608-03756"}
  - {fragment: query-par-test, type: irds:Queries, config: query_par, split: test, citation: "dblp:journals/corr/abs-2608-03756"}
  - {fragment: query-case-train, type: irds:Queries, config: query_case, split: train, citation: "dblp:journals/corr/abs-2608-03756"}
  - {fragment: query-case-dev, type: irds:Queries, config: query_case, split: dev, citation: "dblp:journals/corr/abs-2608-03756"}
  - {fragment: query-case-test, type: irds:Queries, config: query_case, split: test, citation: "dblp:journals/corr/abs-2608-03756"}
  # Qrels (binary; `source` is eur_lex or human)
  - {fragment: qrel-par-par-train, type: irds:Qrels, config: qrel_par_par, split: train, citation: "dblp:journals/corr/abs-2608-03756"}
  - {fragment: qrel-par-par-dev, type: irds:Qrels, config: qrel_par_par, split: dev, citation: "dblp:journals/corr/abs-2608-03756"}
  - {fragment: qrel-par-par-test, type: irds:Qrels, config: qrel_par_par, split: test, citation: "dblp:journals/corr/abs-2608-03756"}
  - {fragment: qrel-par-case-train, type: irds:Qrels, config: qrel_par_case, split: train, citation: "dblp:journals/corr/abs-2608-03756"}
  - {fragment: qrel-par-case-dev, type: irds:Qrels, config: qrel_par_case, split: dev, citation: "dblp:journals/corr/abs-2608-03756"}
  - {fragment: qrel-par-case-test, type: irds:Qrels, config: qrel_par_case, split: test, citation: "dblp:journals/corr/abs-2608-03756"}
  - {fragment: qrel-case-case-train, type: irds:Qrels, config: qrel_case_case, split: train, citation: "dblp:journals/corr/abs-2608-03756"}
  - {fragment: qrel-case-case-dev, type: irds:Qrels, config: qrel_case_case, split: dev, citation: "dblp:journals/corr/abs-2608-03756"}
  - {fragment: qrel-case-case-test, type: irds:Qrels, config: qrel_case_case, split: test, citation: "dblp:journals/corr/abs-2608-03756"}
  # Benchmarks: {query_level}-{document_level}-{split} (only dev and test have a candidate corpus)
  - {fragment: par-par-dev, type: irds:AdhocBenchmark, docs: doc-par-dev, queries: query-par-dev, qrels: qrel-par-par-dev, citation: "dblp:journals/corr/abs-2608-03756"}
  - {fragment: par-par-test, type: irds:AdhocBenchmark, docs: doc-par-test, queries: query-par-test, qrels: qrel-par-par-test, citation: "dblp:journals/corr/abs-2608-03756"}
  - {fragment: par-case-dev, type: irds:AdhocBenchmark, docs: doc-case-dev, queries: query-par-dev, qrels: qrel-par-case-dev, citation: "dblp:journals/corr/abs-2608-03756"}
  - {fragment: par-case-test, type: irds:AdhocBenchmark, docs: doc-case-test, queries: query-par-test, qrels: qrel-par-case-test, citation: "dblp:journals/corr/abs-2608-03756"}
  - {fragment: case-case-dev, type: irds:AdhocBenchmark, docs: doc-case-dev, queries: query-case-dev, qrels: qrel-case-case-dev, citation: "dblp:journals/corr/abs-2608-03756"}
  - {fragment: case-case-test, type: irds:AdhocBenchmark, docs: doc-case-test, queries: query-case-test, qrels: qrel-case-case-test, citation: "dblp:journals/corr/abs-2608-03756"}
